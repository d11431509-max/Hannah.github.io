<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 數位影像工作坊 | Professional Image Lab Pro</title>
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #16161a;
            --accent-color: #3d5afe;
            --accent-hover: #536dfe;
            --text-main: #f0f0f2;
            --text-dim: #94a3b8;
            --border-ui: #2d2d35;
            --success: #00e676;
            --danger: #ff5252;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- 左側控制面板 --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-ui);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .brand {
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand h1 span {
            display: inline-block;
            transition: transform 0.5s ease;
        }

        .brand:hover h1 span {
            transform: rotate(180deg);
        }

        .brand p {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .tool-section {
            margin-bottom: 25px;
        }

        .tool-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 按鈕互動細節 */
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-ui);
            background: transparent;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background-color: var(--border-ui);
            border-color: var(--text-dim);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 0 15px rgba(61, 90, 254, 0.4);
        }

        .btn-success {
            border-color: var(--success);
            color: var(--success);
            margin-top: auto;
        }

        .btn-success:hover {
            background-color: var(--success);
            color: #000;
        }

        /* 參數調整區塊 */
        .control-group {
            background: #1f1f23;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .control-group:focus-within {
            border-color: var(--accent-color);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            background: var(--border-ui);
            border-radius: 5px;
            outline: none;
            accent-color: var(--accent-color);
            cursor: ew-resize;
        }

        /* 濾鏡切換網格 */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-filter.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* --- 右側工作區 --- */
        .workspace {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: var(--bg-primary);
            /* 專業製圖網格背景 */
            background-image: 
                linear-gradient(var(--border-ui) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-ui) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .canvas-container {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            border: 2px solid var(--border-ui);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: none;
            transition: opacity 0.5s ease;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        .status-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--text-dim);
            backdrop-filter: blur(4px);
        }

        /* 歡迎與空白狀態 */
        .welcome-screen {
            text-align: center;
            max-width: 400px;
        }

        .welcome-screen svg {
            width: 100px;
            height: 100px;
            color: var(--accent-color);
            margin-bottom: 24px;
            filter: drop-shadow(0 0 10px rgba(61, 90, 254, 0.4));
        }

        .welcome-screen h2 { margin-bottom: 10px; }
        .welcome-screen p { color: var(--text-dim); font-size: 0.9rem; }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h1><span>⌬</span> AI LAB PRO</h1>
            <p>Advanced Pixel Engine</p>
        </div>

        <!-- 1. 影像輸入 -->
        <div class="tool-section">
            <span class="tool-label">影像來源</span>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                匯入新素材
            </button>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- 2. 核心參數調整 -->
        <div class="tool-section">
            <span class="tool-label">色彩曝光調整</span>
            <div class="control-group">
                <div class="slider-header">
                    <label>亮度 Exposure</label>
                    <span id="brightVal">100%</span>
                </div>
                <input type="range" id="brightness" min="0" max="200" value="100">
            </div>
        </div>

        <!-- 3. AI 濾鏡模擬 (多於三種效果) -->
        <div class="tool-section">
            <span class="tool-label">濾鏡演算模組</span>
            <div class="filter-grid">
                <button class="btn btn-filter active" id="filter-none" onclick="setFilter('none')">原始</button>
                <button class="btn btn-filter" id="filter-grayscale" onclick="setFilter('grayscale')">黑白</button>
                <button class="btn btn-filter" id="filter-invert" onclick="setFilter('invert')">負片</button>
                <button class="btn btn-filter" id="filter-sepia" onclick="setFilter('sepia')">懷舊</button>
            </div>
            <button class="btn" style="margin-top: 15px; border-color: var(--danger); color: var(--danger);" onclick="resetAll()">一鍵重置</button>
        </div>

        <!-- 4. 存檔匯出 -->
        <button class="btn btn-success" onclick="downloadImage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            匯出高品質 PNG
        </button>
    </aside>

    <main class="workspace">
        <div id="welcome" class="welcome-screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <h2>準備就緒</h2>
            <p>點擊左側「匯入」或將檔案拖放到此處</p>
        </div>

        <div id="canvasWrapper" class="canvas-container">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="status-bar" id="statusBar">Engine: Idle</div>
    </main>

    <script>
        /**
         * WSQ 反思紀錄 - 代碼結構解析：
         * 1. 狀態管理：使用 originalImage 儲存未受損的源文件。
         * 2. 渲染管道：processAndRender 函式作為核心，處理像素級循環運算。
         * 3. 響應式交互：監聽 Input 事件而非 Change 事件，達成 0 延遲即時預覽。
         */
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const fileInput = document.getElementById('fileInput');
        const brightnessInput = document.getElementById('brightness');
        const brightValLabel = document.getElementById('brightVal');
        const welcome = document.getElementById('welcome');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const statusBar = document.getElementById('statusBar');

        let originalImage = null;
        let activeFilter = 'none';

        // 初始化影像上傳
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusBar.innerText = "Engine: Loading...";
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    setupCanvas();
                    statusBar.innerText = `Engine: Ready (${img.width}x${img.height})`;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function setupCanvas() {
            welcome.style.display = 'none';
            canvasWrapper.style.display = 'block';
            canvasWrapper.style.opacity = '1';
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            processAndRender();
        }

        function setFilter(type) {
            activeFilter = type;
            // 更新 UI 選取狀態
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${type}`).classList.add('active');
            processAndRender();
        }

        brightnessInput.addEventListener('input', function() {
            brightValLabel.innerText = `${this.value}%`;
            processAndRender();
        });

        /**
         * 進階像素處理引擎
         * 實作了黑白、負片、以及魔改任務：懷舊色調 (Sepia)
         */
        function processAndRender() {
            if (!originalImage) return;

            // 繪製底圖
            ctx.drawImage(originalImage, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const brightness = brightnessInput.value / 100;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // 1. 亮度處理
                r *= brightness;
                g *= brightness;
                b *= brightness;

                // 2. 濾鏡處理
                if (activeFilter === 'grayscale') {
                    const avg = 0.299 * r + 0.587 * g + 0.114 * b;
                    r = g = b = avg;
                } 
                else if (activeFilter === 'invert') {
                    r = 255 - r;
                    g = 255 - g;
                    b = 255 - b;
                }
                else if (activeFilter === 'sepia') {
                    // Sepia 變換矩陣公式
                    let outR = (r * 0.393) + (g * 0.769) + (b * 0.189);
                    let outG = (r * 0.349) + (g * 0.686) + (b * 0.168);
                    let outB = (r * 0.272) + (g * 0.534) + (b * 0.131);
                    r = outR; g = outG; b = outB;
                }

                // 數值溢位保護
                data[i] = r > 255 ? 255 : r;
                data[i+1] = g > 255 ? 255 : g;
                data[i+2] = b > 255 ? 255 : b;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function resetAll() {
            brightnessInput.value = 100;
            brightValLabel.innerText = '100%';
            setFilter('none');
        }

        function downloadImage() {
            if (!originalImage) return;
            const link = document.createElement('a');
            link.download = `LAB_EXPORT_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        // 支援拖放功能 (Drag & Drop)
        const workspace = document.querySelector('.workspace');
        workspace.addEventListener('dragover', e => {
            e.preventDefault();
            workspace.style.backgroundColor = '#1a1a20';
        });
        workspace.addEventListener('dragleave', () => {
            workspace.style.backgroundColor = 'var(--bg-primary)';
        });
        workspace.addEventListener('drop', e => {
            e.preventDefault();
            workspace.style.backgroundColor = 'var(--bg-primary)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const dt = new DataTransfer();
                dt.items.add(file);
                fileInput.files = dt.files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
